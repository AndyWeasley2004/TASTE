data:
    store_dir:
        - windows/large_public
        - windows/curated
        - windows/high_quality
    stage_weights:    null
    max_windows:      20
    enc_seqlen:       96
    dec_seqlen:       1024
    batch_size:       32
    num_workers:      8
    do_augment:       True
    val_fraction:     0.02
    val_cap:          3000
    split_seed:       1234
model:
    model_type:       VAE
    enc_n_layer:      12
    enc_n_head:       8
    enc_d_model:      512
    enc_d_ff:         2048
    dec_n_layer:      12
    dec_n_head:       8
    dec_d_model:      512
    dec_d_ff:         2048
    d_embed:          512
    d_latent:         128
    num_quantizers:   4
    codebook_size:    1024
    rotation_trick:   True
    rvq_type:         SimVQ
    free_bits:        0.0
    pretrained_params_path:  null
    pretrained_optim_path:   null
training:
    device:           cuda:0
    trained_steps:    0
    total_steps:      200000
    max_epochs:       1000
    max_lr:           1.0e-4
    min_lr:           5.0e-6
    lr_warmup_steps:  1000
    ckpt_interval:    5000
    val_interval:     2000
    val_batches:      50
    log_interval:     1
    beta:             0.02
    grad_clip:        0.5
    ckpt_dir:         null
    use_wandb:        False
